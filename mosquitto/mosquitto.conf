# ============================================================
# Mosquitto 2 — broker local + bridge de SAÍDA para o broker
# remoto onde o ESP32 (Wokwi) publica.
#
# ATENÇÃO: este arquivo é um TEMPLATE. Os marcadores __XXX__
# são substituídos na subida do container a partir das
# variáveis do .env (ver o "command:" do serviço mosquitto no
# docker-compose.yml). O mosquitto.conf não lê variáveis de
# ambiente por conta própria, daí o truque com sed.
# ============================================================

# ---- Listener local ----------------------------------------
# Sem autenticação: é uma demo local, roda no notebook.
listener 1883
allow_anonymous true

# Sem persistência de disco: as mensagens retained importantes
# (bomba, status) são reenviadas pela bridge a cada conexão.
persistence false

log_dest stdout
log_type notice
log_type warning
log_type error

# ============================================================
# Bridge para o broker remoto
#
# É uma conexão de CLIENTE, iniciada de dentro para fora: o
# Mosquitto local conecta no broker remoto. Não abre porta no
# roteador e não exige que o Wokwi alcance esta máquina.
#
# As linhas de TLS (bridge_cafile) e de credenciais
# (remote_username / remote_password) NÃO estão aqui: são
# acrescentadas no fim do arquivo pelo docker-compose, só quando
# MQTT_REMOTE_TLS/MQTT_REMOTE_USER estão preenchidos no .env.
# Assim o mesmo template atende o HiveMQ Cloud (TLS + senha) e um
# broker público anônimo, sem precisar de dois arquivos.
# ============================================================
connection bridge-remoto
address __BROKER_REMOTO__:__PORTA_REMOTA__

# Espelhamento do prefixo do projeto, nos dois sentidos:
#   in  = remoto -> local: telemetria publicada pelo ESP32
#   out = local -> remoto: comandos publicados a partir daqui
#
# Sintaxe: topic <padrão> <direção> <qos> <prefixo_local> <prefixo_remoto>
#
# A direção é declarada POR TÓPICO em vez de um "topic # both".
# Motivo: com "both", uma mensagem publicada no broker local sai
# para o remoto e volta pela assinatura da própria bridge, sendo
# entregue duas vezes ao coletor. O Mosquitto só evita esse eco
# com try_private, que exige que o outro lado também seja
# Mosquitto — não é o caso do broker público. Declarando a
# direção de cada tópico, nenhum deles é bidirecional e o eco
# não acontece.
#
# Esta lista é o contrato de tópicos do firmware. Se o ESP32
# ganhar um tópico novo, ele precisa ser acrescentado aqui.

# Telemetria e estado: só entram.
topic nivel                     in  0 __PREFIXO__/ __PREFIXO__/
topic distancia                 in  0 __PREFIXO__/ __PREFIXO__/
topic temperatura               in  0 __PREFIXO__/ __PREFIXO__/
topic bomba                     in  0 __PREFIXO__/ __PREFIXO__/
topic status                    in  0 __PREFIXO__/ __PREFIXO__/
topic alerta/#                  in  0 __PREFIXO__/ __PREFIXO__/
topic comando/bomba/confirmacao in  0 __PREFIXO__/ __PREFIXO__/

# Comandos: só saem, daqui para o ESP32.
# QoS 1 porque o firmware assina este tópico com QoS 1
# (mqtt.subscribe(sub, 1) no sketch) e um comando de bomba não
# pode se perder. A telemetria acima fica em QoS 0: repete a
# cada 2 s, perder uma amostra não custa nada.
topic comando/bomba             out 1 __PREFIXO__/ __PREFIXO__/

# O broker derruba conexões com client id repetido.
remote_clientid __CLIENT_ID__

# try_private é para bridges entre dois Mosquitto. O HiveMQ não
# é Mosquitto, então precisa ficar desligado.
try_private false
bridge_protocol_version mqttv311

cleansession true
keepalive_interval 60

# Reconecta sozinho se a internet cair.
start_type automatic
restart_timeout 10

# Publica o estado da bridge em
#   $SYS/broker/connection/__CLIENT_ID__/state
# (1 = conectada, 0 = caída). Só no broker local.
notifications true
notifications_local_only true
